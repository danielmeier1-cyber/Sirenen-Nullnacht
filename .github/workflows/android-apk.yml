name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.3"
      GODOT_RELEASE: "4.3-stable"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot4
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          debug_keystore="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [[ ! -f "$debug_keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$debug_keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          settings_file="$HOME/.config/godot/editor_settings-4.3.tres"
          cat > "$settings_file" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          "export/android/android_sdk_path" = "$ANDROID_HOME"
          "export/android/java_sdk_path" = "$JAVA_HOME"
          EOF
          godot4 --headless --editor --path . --quit

      - name: Import and export Android APK
        shell: bash
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          chmod +x tools/build_android.sh
          tools/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sirenen-Nullnacht-APK
          path: build/Sirenen-Nullnacht.apk
          if-no-files-found: error
